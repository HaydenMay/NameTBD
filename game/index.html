<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan</title>
<style>
  :root {
    --panel: rgba(251, 246, 234, .96); --solid: #fbf6ea; --ink: #2f241b; --muted: #75654f; --line: #d8c8a8;
    --accent: #8a4b2a; --accent-ink: #fff8ec; --good: #3f7a3a; --bad: #a3392b; --chip: #efe3c8;
    --shadow: 0 4px 18px rgba(40, 25, 10, .22); --bg: #2a231c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(42, 35, 28, .96); --solid: #2a231c; --ink: #f1e6d3; --muted: #b9a88f; --line: #4a3d2f;
      --accent: #d08a5a; --accent-ink: #1f1a15; --good: #8cc47f; --bad: #e98b7c; --chip: #3a3026; --shadow: 0 4px 18px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(42, 35, 28, .96); --solid: #2a231c; --ink: #f1e6d3; --muted: #b9a88f; --line: #4a3d2f;
    --accent: #d08a5a; --accent-ink: #1f1a15; --good: #8cc47f; --bad: #e98b7c; --chip: #3a3026;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 16px/1.45 Georgia, 'Times New Roman', serif; -webkit-tap-highlight-color: transparent; }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .35em; } h3 { font-size: 1.05rem; } h3 small { font-weight: normal; color: var(--muted); font-size: .85rem; }
  p { margin: .35em 0 .6em; }
  button { font: inherit; color: var(--ink); background: var(--solid); border: 2px solid var(--line); border-radius: 10px;
    padding: 8px 14px; min-height: 44px; cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  small { color: var(--muted); }

  /* the world */
  #world { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #actors { position: fixed; inset: 0; pointer-events: none; }
  .actor { position: absolute; pointer-events: auto; background: transparent; border: 0; border-radius: 16px; padding: 0; min-height: 0; }
  .actor:hover, .actor:focus-visible { background: rgba(255, 248, 230, .14); outline: none; }
  .actor .tag { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); white-space: nowrap; font-size: .85rem;
    background: rgba(251, 246, 234, .9); color: #2f241b; border-radius: 999px; padding: 3px 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
    min-height: 30px; display: flex; align-items: center; }
  .actor[data-role="independent"] .tag, .actor[data-role="board"] .tag { background: #8a4b2a; color: #fff8ec; font-weight: bold; }
  .actor[data-role="board"] .tag { bottom: auto; top: -36px; }
  #bubble { position: fixed; z-index: 6; transform: translate(-50%, -100%); width: max-content; max-width: min(320px, 80vw); background: #fffdf6; color: #2f241b;
    border-radius: 14px; padding: 7px 12px; box-shadow: var(--shadow); pointer-events: none; font-size: .98rem; }
  #bubble b { display: block; font-size: .78rem; color: #8a4b2a; }
  #bubble::after { content: ''; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -8px; margin-left: -8px;
    border: 8px solid transparent; border-top-color: #fffdf6; border-bottom: 0; }
  #bubble.sub { transform: translate(-50%, 0); bottom: calc(env(safe-area-inset-bottom) + 84px); top: auto !important; }
  #bubble.sub::after { display: none; }

  /* HUD: one thin strip */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 8; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; background: linear-gradient(rgba(30, 22, 14, .62), rgba(30, 22, 14, 0)); color: #fff8ec;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .6); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .where { display: flex; flex-direction: column; line-height: 1.15; }
  .where b { font-size: 1.05rem; } .where span { font-size: .85rem; opacity: .9; }
  .stats { display: flex; gap: 12px; font-size: .95rem; }
  .stats > span { white-space: nowrap; } .stats .sh { display: none; }
  .hud-btns { margin-left: auto; display: flex; gap: 6px; }
  .hud-btns button { background: rgba(251, 246, 234, .9); color: #2f241b; border: 0; min-height: 40px; padding: 6px 12px; text-shadow: none; }

  /* quick places */
  #places { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 7;
    display: flex; gap: 4px; padding: 5px; background: rgba(30, 22, 14, .55); border-radius: 16px; backdrop-filter: blur(3px); }
  #places button { background: rgba(251, 246, 234, .92); color: #2f241b; border: 0; text-align: center; min-width: 92px; padding: 6px 12px; }
  #places button[aria-current="true"] { background: #8a4b2a; color: #fff8ec; }
  #places button span { display: block; font-size: 1.05rem; line-height: 1; }

  /* travel bar */
  #travelbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 7;
    width: min(720px, calc(100vw - 20px)); display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
    padding: 8px 12px; background: rgba(30, 22, 14, .6); border-radius: 16px; color: #fff8ec; backdrop-filter: blur(3px); }
  .route { display: flex; align-items: center; gap: 8px; font-size: .9rem; min-width: 0; }
  .route .bar { flex: 1; height: 10px; background: rgba(255, 255, 255, .25); border-radius: 5px; overflow: hidden; }
  .route .bar i { display: block; height: 100%; background: #e8b07e; width: 0; }
  #tb-eta { grid-column: 1; font-size: .85rem; opacity: .9; }
  .tb-ctl { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 4px; }
  .tb-ctl button { background: rgba(251, 246, 234, .92); color: #2f241b; border: 0; text-align: center; min-width: 46px; padding: 6px 10px; }
  .tb-ctl button[aria-pressed="true"] { background: #8a4b2a; color: #fff8ec; }

  /* sheet: side panel on wide screens, bottom sheet on phones */
  #sheet { position: fixed; z-index: 9; top: calc(env(safe-area-inset-top) + 58px); right: 8px; bottom: 8px; width: min(440px, 42vw); background: var(--solid);
    box-shadow: var(--shadow); display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; }
  #sheet > header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 16px; border-bottom: 1px solid var(--line); }
  #sheet > header h2 { flex: 1; font-size: 1.2rem; margin: 0; }
  #sheet-body { overflow-y: auto; padding: 10px 16px 24px; overscroll-behavior: contain; }
  .x { background: transparent; border: 0; font-size: 1.6rem; line-height: 1; min-width: 44px; text-align: center; padding: 4px; }
  .row { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .row.done { opacity: .65; }
  .row.person { display: flex; gap: 12px; align-items: flex-start; }
  .back { background: transparent; border: 0; padding: 4px 0; min-height: 36px; color: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .opts.col { flex-direction: column; align-items: stretch; }
  .muted { color: var(--muted); font-size: .95rem; }
  .note { background: var(--chip); border-radius: 10px; padding: 6px 10px; font-size: .95rem; }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--chip); font-size: .85rem; margin: 2px 0; }
  .tag.good, .good { color: var(--good); } .tag.bad, .bad { color: var(--bad); }
  .chips { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-wrap: wrap; gap: 5px; }
  .chips li { background: var(--chip); border-radius: 8px; padding: 2px 8px; font-size: .88rem; }
  .danger-1 { color: #a86a1d; } .danger-2, .danger-3 { color: var(--bad); font-weight: bold; }
  .portrait { width: 48px; height: 48px; border-radius: 50%; background: var(--chip); object-fit: cover; flex: none; border: 2px solid var(--line); vertical-align: middle; }
  .portrait.md { width: 64px; height: 64px; } .portrait.sm { width: 40px; height: 40px; } .portrait.xs { width: 30px; height: 30px; }
  .portrait.dead { filter: grayscale(1); opacity: .6; }
  .trust { font-size: .85rem; color: var(--muted); margin-top: 3px; }
  .meter { position: relative; height: 7px; background: var(--chip); border-radius: 4px; max-width: 220px; }
  .meter i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
  .meter .mark { position: absolute; top: -3px; width: 2px; height: 13px; background: var(--ink); }
  .people { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
  .people li { display: flex; gap: 10px; align-items: center; }
  .members { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .member { display: flex; align-items: center; gap: 10px; }
  .member span { flex: 1; display: flex; flex-direction: column; } .member i { font-style: normal; font-size: .9rem; color: var(--muted); }
  .member[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); }
  .member[aria-pressed="true"] i { color: var(--accent); font-weight: bold; }
  .odds { background: var(--chip); border-radius: 12px; padding: 8px 12px; margin: 8px 0; }
  .big-num { font-size: 1.4rem; }
  .odds table { width: 100%; border-collapse: collapse; margin: 4px 0; }
  .odds th, .odds td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  .confirm { display: flex; gap: 10px; align-items: center; padding: 8px; border: 2px dashed var(--bad); border-radius: 10px; cursor: pointer; }
  .confirm input { width: 22px; height: 22px; }
  .report { position: relative; border-radius: 12px; padding: 8px 40px 8px 12px; margin-bottom: 10px; background: var(--chip); border-left: 5px solid var(--good); }
  .report.bad { border-left-color: var(--bad); }
  .report .x { position: absolute; right: 2px; top: 2px; }
  .report p { margin: .2em 0; }
  .paper { background: #f6ecd2; color: #3a2c1e; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
  .paper p { font-style: italic; margin: 0; }
  .plain { padding-left: 18px; margin: 4px 0; }
  .local { font-style: italic; }
  .log { margin: 4px 0 0; padding-left: 18px; font-size: .85rem; color: var(--muted); }
  .entry { margin: .25em 0 .7em; }

  /* talk / decision panel */
  #panel { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: min(640px, calc(100vw - 20px)); max-height: 62vh; overflow-y: auto; background: var(--solid); border-radius: 18px;
    box-shadow: var(--shadow); padding: 10px 14px 12px; }
  #panel > header { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
  #panel > header > div { flex: 1; display: flex; flex-direction: column; }
  #panel > header small { font-size: .85rem; }
  .lines p { margin: .25em 0; } .lines b { color: var(--accent); margin-right: 4px; } .lines .me { color: var(--muted); }
  .estimate { font-size: .95rem; }
  .choices { flex-direction: column; align-items: stretch; }
  .choices button { display: flex; flex-direction: column; }
  .cast-line { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  body[data-mode="town"] #panel, body[data-mode="title"] #panel { bottom: calc(env(safe-area-inset-bottom) + 76px); }

  /* cards: title, arrival */
  #card { position: fixed; z-index: 11; left: 50%; top: 18%; transform: translateX(-50%); width: min(460px, calc(100vw - 24px));
    background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 20px; text-align: center; }
  #card[data-kind="title"] { top: auto; bottom: 14%; }
  #card h1 { font-size: 2.6rem; letter-spacing: .04em; margin: 0; }
  #card .opts { justify-content: center; } #card .opts.col button { text-align: center; }
  #card[data-kind="arrival"] { top: calc(env(safe-area-inset-top) + 150px); cursor: pointer; }
  .small { font-size: .82rem; color: var(--muted); }

  #toasts { position: fixed; z-index: 12; top: calc(env(safe-area-inset-top) + 58px); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(460px, calc(100vw - 24px)); }
  .toast { background: rgba(251, 246, 234, .95); color: #2f241b; border-left: 4px solid var(--good); border-radius: 10px; padding: 5px 12px;
    box-shadow: var(--shadow); font-size: .9rem; }
  .toast.bad { border-left-color: var(--bad); }

  @media (max-width: 859px) {
    #sheet { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 74vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    body.sheet-open #bubble { display: none; }
  }
  @media (max-width: 640px) {
    body { font-size: 15px; }
    .hud-btns .lbl, .stats .lbl { display: none; } .stats .sh { display: inline; }
    #hud { flex-wrap: nowrap; gap: 8px; } .where { min-width: 0; } .where b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats { gap: 8px; font-size: .85rem; flex-direction: column; gap: 0; line-height: 1.2; }
    .hud-btns button { min-width: 42px; padding: 4px 8px; text-align: center; }
    #places { left: 8px; right: 8px; transform: none; justify-content: space-between; }
    #places button { flex: 1; min-width: 0; padding: 5px 4px; font-size: .85rem; }
    #travelbar { grid-template-columns: 1fr; }
    .tb-ctl { grid-column: 1; grid-row: auto; justify-content: center; }
    .tb-ctl button { flex: 1; }
  }
</style>
</head>
<body data-mode="title">
<canvas id="world" aria-hidden="true"></canvas>
<div id="actors" aria-label="People and things here"></div>
<div id="bubble" role="status" aria-live="polite" hidden></div>
<header id="hud" hidden>
  <div class="where"><b id="hud-loc"></b><span id="hud-time"></span></div>
  <div class="stats">
    <span title="Gold in the caravan's shared purse"><span class="lbl">Gold </span><b id="hud-gold"></b><span class="sh">g</span></span>
    <span title="Provisions: each traveller eats 1 every 12 hours on the road"><span class="lbl">Provisions </span><b id="hud-prov"></b><span class="sh"> food</span></span>
    <span title="Companion bedrolls in use / available"><span class="lbl">Bedrolls </span><b id="hud-beds"></b><span class="sh"> beds</span></span>
  </div>
  <div class="hud-btns">
    <button data-action="people" aria-label="People">👥 <span class="lbl">People</span></button>
    <button data-action="chronicle" aria-label="Chronicle">📖 <span class="lbl">Chronicle</span></button>
    <button data-action="menu" aria-label="Menu">☰ <span class="lbl">Menu</span></button>
  </div>
</header>
<nav id="places" aria-label="Places in town" hidden>
  <button data-action="nav" data-view="center"><span aria-hidden="true">⌂</span>Square</button>
  <button data-action="nav" data-view="guild"><span aria-hidden="true">✦</span>Guild</button>
  <button data-action="nav" data-view="market"><span aria-hidden="true">⚖</span>Market</button>
  <button data-action="nav" data-view="caravan"><span aria-hidden="true">⛟</span>Caravan</button>
</nav>
<div id="travelbar" hidden>
  <div class="route"><b id="tb-from"></b><div class="bar"><i id="tb-fill"></i></div><b id="tb-to"></b></div>
  <span id="tb-eta"></span>
  <div class="tb-ctl" role="group" aria-label="Travel controls">
    <button data-action="pause" id="tb-pause"></button>
    <button data-action="speed" data-v="1">1×</button><button data-action="speed" data-v="2">2×</button><button data-action="speed" data-v="4">4×</button>
  </div>
</div>
<aside id="sheet" hidden><header><h2 id="sheet-title"></h2><button class="x" data-action="close-sheet" aria-label="Close">×</button></header><div id="sheet-body"></div></aside>
<section id="panel" aria-live="polite" hidden></section>
<div id="card" data-action="dismiss-card" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="main.js"></script>
</body>
</html>
