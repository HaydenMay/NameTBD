<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caravan</title>
<style>
  :root {
    --bg: #efe6d2; --panel: #fbf6ea; --ink: #2f241b; --muted: #75654f; --line: #d8c8a8;
    --accent: #8a4b2a; --accent-ink: #fff8ec; --good: #3f7a3a; --bad: #a3392b; --chip: #efe3c8;
    --shadow: 0 2px 10px rgba(60, 40, 20, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1a15; --panel: #2a231c; --ink: #f1e6d3; --muted: #b9a88f; --line: #4a3d2f;
      --accent: #d08a5a; --accent-ink: #1f1a15; --good: #8cc47f; --bad: #e98b7c; --chip: #3a3026;
      --shadow: 0 2px 10px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1a15; --panel: #2a231c; --ink: #f1e6d3; --muted: #b9a88f; --line: #4a3d2f;
    --accent: #d08a5a; --accent-ink: #1f1a15; --good: #8cc47f; --bad: #e98b7c; --chip: #3a3026;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, 'Times New Roman', serif; }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
  h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; }
  p { margin: .4em 0 .7em; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 10px;
    padding: 10px 14px; min-height: 44px; cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.big { font-size: 1.05rem; padding: 12px 18px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .hud { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 8px 16px; background: var(--panel); border-bottom: 2px solid var(--line); box-shadow: var(--shadow); }
  .hud-where { display: flex; flex-direction: column; min-width: 150px; }
  .hud-where strong { font-size: 1.05rem; } .hud-where span { color: var(--muted); font-size: .9rem; }
  .hud-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .95rem; }
  .hud-stats span { white-space: nowrap; } .hud-stats b { font-size: 1.1rem; }
  .hud-btns { margin-left: auto; display: flex; gap: 6px; }
  .hud-btns button { padding: 6px 12px; min-height: 40px; }
  .goal { max-width: 1100px; margin: 10px auto 0; padding: 8px 16px; color: var(--muted); font-style: italic; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }

  .title { text-align: center; padding: 12vh 0 0; }
  .title h1 { font-size: 3.2rem; letter-spacing: .04em; }
  .title .sub { color: var(--muted); font-size: 1.15rem; }
  .title .actions { max-width: 360px; margin: 24px auto; }
  .title button { text-align: center; }
  .small { font-size: .85rem; color: var(--muted); }

  .town-art { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); height: clamp(130px, 26vw, 250px); }
  .town-art svg { width: 100%; height: 100%; display: block; }
  .town-title { position: absolute; left: 14px; bottom: 10px; background: rgba(251, 246, 234, .9); color: #2f241b;
    padding: 6px 14px; border-radius: 10px; }
  .town-title h1 { font-size: 1.6rem; margin: 0; } .town-title p { margin: 0; font-size: .9rem; color: #75654f; }
  .places { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 4px; }
  .place-btn { text-align: center; font-size: 1rem; }
  .place-btn[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .blurb { color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
  .card.done { opacity: .75; }
  .muted { color: var(--muted); }
  .note { background: var(--chip); border-radius: 10px; padding: 8px 12px; font-size: .95rem; }
  .center { text-align: center; }
  .actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  .actions.wrap { flex-wrap: wrap; justify-content: flex-start; }
  .actions.col { flex-direction: column; align-items: stretch; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--chip); font-size: .85rem; margin: 2px 0; }
  .tag.good { color: var(--good); } .tag.bad { color: var(--bad); }
  .bad { color: var(--bad); } .good { color: var(--good); }
  .chips { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li { background: var(--chip); border-radius: 8px; padding: 3px 9px; font-size: .9rem; }
  .chips .danger-1 b { color: #a86a1d; } .chips .danger-2 b, .chips .danger-3 b { color: var(--bad); }

  .portrait { width: 56px; height: 56px; border-radius: 50%; background: var(--chip); object-fit: cover; flex: none; border: 2px solid var(--line); }
  .portrait.lg { width: 88px; height: 88px; } .portrait.sm { width: 40px; height: 40px; }
  .portrait.dead { filter: grayscale(1); opacity: .6; }
  .person .who { display: flex; gap: 12px; align-items: flex-start; }
  .person .who > div { flex: 1; min-width: 0; }
  .trust { margin-top: 6px; font-size: .9rem; color: var(--muted); }
  .meter { position: relative; height: 8px; background: var(--chip); border-radius: 4px; overflow: visible; margin-bottom: 2px; }
  .meter i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
  .meter .mark { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); }
  .notice { font-size: .95rem; } .notice.read { opacity: .7; }
  .local p { margin: .2em 0 .6em; font-style: italic; }
  .log { margin: 6px 0 0; padding-left: 18px; font-size: .88rem; color: var(--muted); }

  .modal-back { position: fixed; inset: 0; background: rgba(20, 14, 8, .55); z-index: 20; display: flex; align-items: flex-start;
    justify-content: center; padding: 5vh 16px; overflow-y: auto; }
  .modal-back[hidden] { display: none; }
  .modal { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 20px; width: min(720px, 100%); box-shadow: var(--shadow); }
  .modal .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .convo { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
  .convo .line { display: flex; gap: 10px; align-items: flex-start; }
  .convo .line p { margin: 0; } .convo .line.me p { color: var(--muted); }
  .people { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
  .people li { display: flex; gap: 10px; align-items: center; }
  .members { display: flex; flex-direction: column; gap: 6px; }
  .member { display: flex; align-items: center; gap: 10px; }
  .member span { flex: 1; display: flex; flex-direction: column; } .member small { color: var(--muted); }
  .member i { font-style: normal; font-size: .9rem; color: var(--muted); }
  .member[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); }
  .member[aria-pressed="true"] i { color: var(--accent); font-weight: bold; }
  .odds { background: var(--chip); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
  .odds small { display: block; color: var(--muted); }
  .big-num { font-size: 1.5rem; }
  .odds table { width: 100%; border-collapse: collapse; margin: 6px 0; }
  .odds th, .odds td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .confirm { display: flex; gap: 10px; align-items: center; padding: 10px; border: 2px dashed var(--bad); border-radius: 10px; cursor: pointer; }
  .confirm input { width: 22px; height: 22px; }
  .choices button { display: flex; flex-direction: column; } .choices small { color: var(--muted); }
  .cast { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 14px 0; }
  .cast-card { display: flex; flex-direction: column; align-items: center; text-align: center; width: 120px; }
  .cast-card span { color: var(--muted); font-size: .9rem; }
  .paper { background: #f6ecd2; color: #3a2c1e; padding: 14px; border-radius: 8px; font-style: italic; }
  .entry { margin: .3em 0 .8em; }

  .travel .stage { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--line); }
  .travel canvas { display: block; width: 100%; }
  .chatter { position: absolute; left: 12px; right: 12px; top: 12px; margin: 0 auto; max-width: 560px; background: rgba(251, 246, 234, .94);
    color: #2f241b; border-radius: 12px; padding: 8px 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .chatter.show { opacity: 1; }
  .paused-tag { position: absolute; right: 12px; bottom: 12px; background: rgba(20, 14, 8, .7); color: #fff; padding: 4px 12px; border-radius: 8px; }
  .progress { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; font-weight: bold; }
  .bar { flex: 1; height: 12px; background: var(--chip); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .bar div { height: 100%; background: var(--accent); width: 0; }
  .eta { margin: 2px 0; text-align: center; color: var(--muted); }
  .controls { justify-content: center; flex-wrap: wrap; }
  .speeds { display: flex; gap: 4px; } .speeds button { min-width: 56px; text-align: center; }
  .speeds button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
  .toast { background: var(--panel); border: 2px solid var(--good); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); font-size: .95rem; }
  .toast.bad { border-color: var(--bad); }

  @media (max-width: 640px) {
    body { font-size: 15px; }
    .hud { padding: 6px 12px; gap: 4px 12px; }
    .hud-btns { margin-left: 0; width: 100%; }
    .hud-btns button { flex: 1; text-align: center; }
    .places { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
    main { padding: 8px 12px 48px; }
    .goal { padding: 6px 12px; }
    .actions { flex-wrap: wrap; }
    .title h1 { font-size: 2.6rem; }
  }
</style>
</head>
<body>
<header class="hud" id="hud" hidden>
  <div class="hud-where"><strong id="hud-loc"></strong><span id="hud-time"></span></div>
  <div class="hud-stats">
    <span title="The caravan's shared purse">Gold <b id="hud-gold"></b></span>
    <span title="Each traveller eats 1 every 12 hours on the road">Provisions <b id="hud-prov"></b></span>
    <span title="Companion bedrolls in use / available">Bedrolls <b id="hud-beds"></b></span>
  </div>
  <nav class="hud-btns"><button data-action="party">People</button><button data-action="chronicle">Chronicle</button><button data-action="menu">Menu</button></nav>
</header>
<p class="goal" id="goal" hidden></p>
<main id="screen"><section class="title"><h1>Caravan</h1><p class="sub">Loading…</p></section></main>
<div class="modal-back" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modal-body"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="main.js"></script>
</body>
</html>
